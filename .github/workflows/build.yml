on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build
        run: make docker-smoke
  test:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
          xcodebuild -version
      - name: Run tests
        run: IntegrationTests/run.sh
